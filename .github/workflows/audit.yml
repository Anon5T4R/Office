name: Audit semanal de dependências

# Varre o src-tauri/Cargo.lock de TODOS os repos públicos do Anon5T4R e roda
# cargo audit contra o banco RustSec. A lista de repos é descoberta na hora —
# app novo com Cargo.lock commitado entra sozinho na varredura.
#
# Job vermelho = alguma dep travada num lock tem CVE conhecida (o log diz qual
# repo/dep/advisory). É o alarme que torna seguro só atualizar deps em release
# maior — ver docs/planos/locks-e-deps.md no dev-notes.
on:
  schedule:
    - cron: "0 9 * * 1" # toda segunda, 06:00 BRT (09:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Auditar os Cargo.lock de todos os repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          fail=0
          total=0

          # Pendências ACEITAS por repo (presas em upstream; revisar a cada release maior).
          # Justificativas em docs/planos/locks-e-deps.md (dev-notes):
          # - LocalAI/LocalImage: quick-xml velho via wayland-scanner (proc-macro, SÓ build-time,
          #   parseia XML estático do próprio crate — sem exposição em runtime) e via xcb do
          #   xcap 0.4 (pinado de propósito, build-dep).
          # - LocalCode: rustls-webpki 0.102 preso no octocrab 0.38 (upgrade é breaking; só fala
          #   com api.github.com). Consertar no próximo minor. rustls 0.22 idem: vem da cadeia
          #   hyper-rustls/tokio-rustls do octocrab — sobe junto no upgrade.
          # - LocalClip/LocalTranslate: quick-xml 0.39 via wayland-scanner (build-time, mesma
          #   justificativa de LocalAI/LocalImage).
          # - LocalFeed: h2 0.3 preso na cadeia readability 0.3 -> reqwest 0.11 (upgrade de
          #   reqwest e breaking; consertar no proximo minor do readability/reqwest).
          # Leva RustSec out/2026 (2026-10-22): rustls/rustls-webpki/webpki-roots/
          # anyhow/quinn-proto/etc. FORAM atualizados nos locks de todos os apps.
          # O que nao tem fix compativel fica tolerado aqui:
          # - zip >= 9.0.0 e breaking (docx-rs/outros usam ^8.6); as CVEs sao de
          #   EXTRACAO de zip malicioso (symlink/SUID). LocalAI so ESCREVE o
          #   .docx; LocalZip/Files/Browser/Translate/ZIM extraem -> por isso
          # - LocalCode/TaylorChat: rustls 0.22.x e rustls-webpki 0.102.x presos
          #   no octocrab 0.38 / libp2p (upgrade breaking) — RUSTSEC-2026-0346/
          #   0349/0382; sobem junto no proximo minor desses apps.
          #   estes precisam subir pra zip 9 no proximo release (divida registrada
          #   em docs/ESTADO.md).
          ZIP="--ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369"
          QT="--ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195"
          declare -A IGNORE=(
            [LocalAI]="$QT $ZIP"
            [LocalImage]="$QT"
            [LocalClip]="$QT"
            [LocalTranslate]="$QT $ZIP"
            [LocalZip]="$ZIP"
            [LocalFiles]="$ZIP"
            [LocalBrowser]="$ZIP"
            [LocalZIM]="$ZIP"
            [LocalFeed]="--ignore RUSTSEC-2026-0258"
            [LocalCode]="--ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2026-0049 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0285 --ignore RUSTSEC-2026-0346 --ignore RUSTSEC-2026-0349 --ignore RUSTSEC-2026-0382"
            [TaylorChat]="--ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2026-0049 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0118 --ignore RUSTSEC-2026-0119 --ignore RUSTSEC-2026-0382"
          )
          echo "| Repo | Resultado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          repos=$(gh api --paginate users/Anon5T4R/repos --jq '.[].name' | sort)
          for r in $repos; do
            # HEAD resolve o branch padrão (main ou master); 404 = repo sem app Tauri
            if ! curl -fsSL "https://raw.githubusercontent.com/Anon5T4R/$r/HEAD/src-tauri/Cargo.lock" -o /tmp/Cargo.lock 2>/dev/null; then
              continue
            fi
            total=$((total + 1))
            if out=$(cargo audit -f /tmp/Cargo.lock ${IGNORE[$r]:-} 2>&1); then
              echo "| $r | ok |" >> "$GITHUB_STEP_SUMMARY"
              echo "$r: ok"
            else
              fail=1
              echo "| $r | **VULNERAVEL** — ver log do job |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=cargo audit ($r)::dep vulneravel no Cargo.lock de $r"
              echo "===== $r ====="
              echo "$out"
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$total locks auditados." >> "$GITHUB_STEP_SUMMARY"
          exit $fail
